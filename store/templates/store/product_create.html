{% extends 'store/base.html' %}

{% block content %}

<div class="container py-5">

    <h1>Add Product</h1>

    <p class="text-muted">
        Add a new product to your Vetri AI store.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}


    <form method="post"
          enctype="multipart/form-data"
          class="card p-4 shadow-sm">

        {% csrf_token %}


        <!-- Product Name -->

        <div class="mb-3">

            <label for="name" class="form-label">
                Product Name *
            </label>

            <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                placeholder="Enter product name"
                required
            >

        </div>


        <!-- Brand -->

        <div class="mb-3">

            <label for="brand" class="form-label">
                Brand
            </label>

            <input
                type="text"
                name="brand"
                id="brand"
                class="form-control"
                placeholder="Enter brand name"
            >

        </div>


        <!-- SKU -->

        <div class="mb-3">

            <label for="sku" class="form-label">
                SKU
            </label>

            <input
                type="text"
                name="sku"
                id="sku"
                class="form-control"
                placeholder="Enter SKU"
            >

        </div>


        <!-- Price -->

        <div class="mb-3">

            <label for="price" class="form-label">
                Selling Price
            </label>

            <input
                type="number"
                step="0.01"
                name="price"
                id="price"
                class="form-control"
                placeholder="Enter selling price"
            >

        </div>


        <!-- Cost -->

        <div class="mb-3">

            <label for="cost" class="form-label">
                Cost Price
            </label>

            <input
                type="number"
                step="0.01"
                name="cost"
                id="cost"
                class="form-control"
                placeholder="Enter cost price"
            >

        </div>


        <!-- Inventory -->

        <div class="mb-3">

            <label for="inventory" class="form-label">
                Inventory / Stock
            </label>

            <input
                type="number"
                name="inventory"
                id="inventory"
                class="form-control"
                value="0"
                min="0"
            >

        </div>


        <!-- Category -->

        <div class="mb-3">

            <label for="category" class="form-label">
                Category
            </label>

            <select
                name="category"
                id="category"
                class="form-select"
            >

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- Subcategory -->

        <div class="mb-3">

            <label for="subcategory" class="form-label">
                Subcategory
            </label>

            <select
                name="subcategory"
                id="subcategory"
                class="form-select"
            >

                <option value="">
                    Select Subcategory
                </option>

            </select>

        </div>


        <!-- Description -->

        <div class="mb-3">

            <label for="description" class="form-label">
                Product Description
            </label>

            <textarea
                name="description"
                id="description"
                class="form-control"
                rows="5"
                placeholder="Enter product description"
            ></textarea>

        </div>


        <!-- Image -->

        <div class="mb-3">

            <label for="image" class="form-label">
                Product Image
            </label>

            <input
                type="file"
                name="image"
                id="image"
                class="form-control"
                accept="image/*"
            >

        </div>


        <!-- Buttons -->

        <div class="mt-3">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Product & Analyze with AI
            </button>

            <a
                href="{% url 'dashboard' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
