{% extends "store/base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'store/css/auth.css' %}">

<div class="auth-page">

    <div class="auth-card">

        <!-- Logo / Title -->
        <div class="auth-logo">

            <div class="auth-logo-icon">
                <i class="fas fa-robot"></i>
            </div>

            <h2>Vetri AI</h2>

            <p>Create your account</p>

        </div>

        <!-- Register Title -->
        <h3>Register</h3>

        <!-- Messages -->
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <!-- Register Form -->
        <form method="POST" action="{% url 'register' %}">

            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">

                <label for="username">
                    Username
                </label>

                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username"
                    autocomplete="username" required>

            </div>

            <!-- Email -->
            <div class="mb-3">

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" class="form-control" placeholder="Enter email address"
                    autocomplete="email" required>

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label for="password">
                    Password
                </label>

                <div class="input-group">

                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Create password" autocomplete="new-password" required>

                    <button type="button" class="btn btn-outline-secondary password-toggle" data-target="password"
                        title="Show/Hide password">
                        <i class="fas fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- Confirm Password -->
            <div class="mb-3">

                <label for="password2">
                    Confirm Password
                </label>

                <div class="input-group">

                    <input type="password" id="password2" name="password2" class="form-control"
                        placeholder="Confirm password" autocomplete="new-password" required>

                    <button type="button" class="btn btn-outline-secondary password-toggle" data-target="password2"
                        title="Show/Hide password">
                        <i class="fas fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- Register Button -->
            <button type="submit" class="auth-btn">
                <i class="fas fa-user-plus"></i>
                Register
            </button>

        </form>

        <!-- Login -->
        <div class="auth-switch">

            <p>
                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>
            </p>

        </div>

        <!-- Back Home -->
        <div class="back-home">

            <a href="{% url 'home' %}">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </div>

</div>

<!-- Password Show / Hide -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const passwordToggles = document.querySelectorAll(".password-toggle");

    passwordToggles.forEach(function (button) {

        button.addEventListener("click", function () {

            const targetId = this.getAttribute("data-target");
            const passwordInput = document.getElementById(targetId);
            const icon = this.querySelector("i");

            if (!passwordInput) {
                return;
            }

            if (passwordInput.type === "password") {

                // Show password
                passwordInput.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

                this.setAttribute("title", "Hide password");

            } else {

                // Hide password
                passwordInput.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");

                this.setAttribute("title", "Show password");

            }

        });

    });

});
</script>



{% endblock %}
