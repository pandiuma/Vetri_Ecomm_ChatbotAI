{% extends "store/base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'store/css/auth.css' %}">

<div class="auth-page">

<div class="auth-card">

    <div class="auth-logo">

        <div class="reset-icon">
            <i class="fas fa-key"></i>
        </div>

        <h2>Vetri AI</h2>

        <p>Reset your password</p>

    </div>

    <h3>Forgot Password?</h3>

    <p class="auth-description">
        Enter your registered email address and we will send you
        instructions to reset your password.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label for="id_email">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="id_email"
                class="form-control"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

        </div>

        <button
            type="submit"
            class="auth-btn"
        >
            <i class="fas fa-paper-plane"></i>
            Send Reset Link
        </button>

    </form>

    <div class="auth-switch">

        <p>
            Remember your password?

            <a href="{% url 'login' %}">
                Back to Login
            </a>
        </p>

    </div>

    <div class="back-home">

        <a href="{% url 'home' %}">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>


</div>

{% endblock %}
